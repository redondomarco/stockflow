name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: stockflow
          POSTGRES_USER: stockflow
          POSTGRES_PASSWORD: stockflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEBUG: 'True'
      SECRET_KEY: ci-only-secret
      DATABASE_URL: postgresql://stockflow:stockflow@localhost:5432/stockflow
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt coverage
      - name: Migraciones versionadas al día
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: coverage run --source=apps --omit="*/migrations/*,*/tests*.py,*/test_*.py" manage.py test apps --noinput
      - run: coverage report

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
