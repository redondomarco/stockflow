# Producción: nginx (frontend compilado + proxy) es el único servicio expuesto.
# Configuración y secretos en .env (ver .env.example).
# Desarrollo: docker compose -f docker-compose.yml -f docker-compose.dev.yml up  (o `make dev`)

# Logs de Docker con tamaño acotado (evita llenar el disco del servidor)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:15-alpine
    container_name: stockflow_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockflow}
      POSTGRES_USER: ${POSTGRES_USER:-stockflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    container_name: stockflow_redis
    restart: unless-stopped
    logging: *logging

  backend:
    build:
      context: ./backend
    container_name: stockflow_backend
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DEBUG=${DEBUG:-False}
      - HTTPS=${HTTPS:-False}
      - SECRET_KEY=${SECRET_KEY:-}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-stockflow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stockflow}
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    logging: *logging

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}  # `make deploy` la toma del tag de git
    container_name: stockflow_nginx
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - backend
    restart: unless-stopped
    logging: *logging

volumes:
  postgres_data:
  static_volume:
  media_volume:
