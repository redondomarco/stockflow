upstream backend {
    server backend:8000;
}

# Detrás de Caddy (despliegue HTTPS) la IP real del cliente viene en
# X-Forwarded-For; solo se le cree a proxies de las redes internas de Docker.
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;

# Protocolo original: el que informa Caddy, o el de esta conexión si no hay proxy.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Límite de intentos de login por IP (fuerza bruta): 10 por minuto, ráfaga de 5.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # Los tiles de OpenStreetMap exigen Referer: no usar same-origin/no-referrer
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # Login de la app y del admin: con límite de intentos
    location = /api/token/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend;
    }

    location = /admin/login/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend;
    }

    location /api/ {
        proxy_pass http://backend;
    }

    location /admin/ {
        proxy_pass http://backend;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    # Assets de Vite: nombres con hash, se pueden cachear indefinidamente
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier otra ruta devuelve index.html (sin cache, para tomar cada deploy)
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        # add_header en un location anula los del server: se repiten los de seguridad
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
